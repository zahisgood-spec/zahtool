<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<script src="../assets/nova-console.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060d"><title>我的主控台｜ZAHTOOL</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060d;--text:#f3f2ff;--muted:#9aa2c4;--line:#ffffff1a;--violet:#a58bff;--cyan:#6fdcff;--mint:#72f2d2;--g1:#dccfff;--g2:#7fe0ff;--g3:#93f8d9;--disp:Syne,"Noto Sans TC",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100svh;color:var(--text);font-family:"Noto Sans TC",system-ui,sans-serif;background:radial-gradient(ellipse at 10% -5%,#34215d 0,transparent 38%),radial-gradient(ellipse at 95% 8%,#11314b 0,transparent 32%),var(--bg)}
a{color:inherit;text-decoration:none}button,input,select{font:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}
.wrap{width:min(1180px,calc(100% - 36px));margin:auto;padding:26px 0 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;font:800 1.08rem var(--disp)}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--g1),var(--g2));color:#080a16}
.g{background:linear-gradient(100deg,var(--g1),var(--g2) 55%,var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{border:1px solid var(--line);background:#0b0e1dcc;border-radius:99px;padding:10px 16px;font-size:.84rem;font-weight:700;color:#e5e6ff}
h1{font:800 clamp(2rem,5vw,3.4rem)/1.05 var(--disp);letter-spacing:-.04em;margin:30px 0 8px}.sub{color:var(--muted);margin:0 0 26px}
.panel{border:1px solid var(--line);border-radius:22px;background:linear-gradient(150deg,#161a33b8,#0b0e1dc8);backdrop-filter:blur(16px);padding:22px;margin-bottom:16px}
.panel h2{font-size:1rem;margin:0 0 14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px;border-radius:16px;background:#ffffff08;border:1px solid var(--line)}.stat b{display:block;font:800 1.7rem var(--disp)}.stat span{color:var(--muted);font-size:.8rem}
.set{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 26px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}.row label{font-size:.9rem}
input[type=text],input[type=search],select{background:#0b0e1d;border:1px solid #ffffff26;color:#fff;border-radius:12px;padding:9px 12px;min-width:0;max-width:100%}
input[type=range]{accent-color:var(--violet);width:150px}
.sw{position:relative;width:42px;height:24px;flex:none}.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}.sw i{position:absolute;inset:0;border-radius:99px;background:#ffffff1f;transition:.25s}.sw i:after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.25s}.sw input:checked+i{background:linear-gradient(110deg,var(--violet),var(--cyan))}.sw input:checked+i:after{transform:translateX(18px)}.sw input:focus-visible+i{outline:2px solid var(--cyan);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.bar input[type=search]{flex:1;min-width:180px}
.btn{border:1px solid var(--line);background:#ffffff0a;color:#e5e6ff;border-radius:99px;padding:9px 16px;font-size:.84rem;font-weight:700}.btn:hover{border-color:var(--violet)}.btn.danger:hover{border-color:#ff7a8a;color:#ffb3bc}
.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tc{--accent:#a58bff;border:1px solid var(--line);border-radius:20px;background:#0b0e1de0;padding:18px;position:relative;overflow:hidden;transition:opacity .3s,border-color .3s}.tc:before{content:"";position:absolute;width:120px;height:120px;border-radius:50%;background:var(--accent);filter:blur(60px);opacity:.14;right:-40px;top:-50px}
.tc.off{opacity:.5}.tc.hide{display:none}.th{display:flex;gap:12px;align-items:center;margin-bottom:12px;position:relative}.ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--accent);background:color-mix(in srgb,var(--accent),transparent 88%);border:1px solid color-mix(in srgb,var(--accent),transparent 66%)}
.th h3{margin:0;font-size:1rem}.th small{color:var(--muted);font-size:.76rem}.pin{margin-left:auto;border:0;background:none;color:#ffffff55;font-size:1.3rem;padding:4px}.pin[aria-pressed=true]{color:#ffd36b}
.tc .row{min-height:34px}.tc .row label{font-size:.84rem;color:#cfd3f0}.ta{display:flex;gap:8px;margin-top:12px}.ta .btn{flex:1;text-align:center;padding:8px 10px;font-size:.8rem}
.empty{display:none;text-align:center;color:var(--muted);padding:28px;border:1px dashed var(--line);border-radius:16px}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#161a33f2;border:1px solid var(--line);border-radius:99px;padding:10px 18px;font-size:.86rem;transition:.3s;z-index:120}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.list{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.set{grid-template-columns:1fr}}
@media(max-width:600px){.list{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="../assets/nova-fx.css">
</head>
<body>
<div class="wrap">
<div class="top"><a class="brand" href="../index.html"><span class="logo">Z</span><span>ZAH<span class="g">TOOL</span></span></a><span style="display:flex;gap:8px"><a class="pill acLink" href="../account/index.html">👤 登入</a><a class="pill" href="../index.html#toolbox">← 所有工具</a></span></div>
<h1 id="hello">我的<span class="g">主控台</span></h1>
<p class="sub">設定會儲存在這個瀏覽器，只屬於你自己。可匯出備份，換裝置時再匯入。</p>

<section class="panel"><h2>總覽</h2><div class="stats"><div class="stat"><b id="stT">0</b><span>工具總數</span></div><div class="stat"><b id="stE">0</b><span>已啟用</span></div><div class="stat"><b id="stN">0</b><span>累計開啟次數</span></div><div class="stat"><b id="stTop">—</b><span>最常用工具</span></div></div></section>

<section class="panel"><h2>帳號與雲端同步</h2><div class="row"><span id="acInfo">—</span><a class="btn" href="../account/index.html" id="acBtn">登入 / 註冊</a></div></section>

<section class="panel"><h2>個人與全域設定</h2><div class="set">
<div class="row"><label for="uName">顯示名稱</label><input id="uName" type="text" maxlength="24" placeholder="你的名字"></div>
<div class="row"><label for="sSort">首頁排序（釘選永遠最前）</label><select id="sSort"><option value="default">預設順序</option><option value="used">最常使用</option><option value="recent">最近使用</option></select></div>
<div class="row"><label for="sSfx">音效</label><span class="sw"><input id="sSfx" type="checkbox"><i></i></span></div>
<div class="row"><label for="sVol">音量</label><input id="sVol" type="range" min="0" max="1" step="0.05"></div>
<div class="row"><label for="sFx">動態效果（3D 與動畫）</label><span class="sw"><input id="sFx" type="checkbox"><i></i></span></div>
</div></section>

<section class="panel"><h2>工具控制</h2>
<div class="bar"><input id="q" type="search" placeholder="篩選工具…" aria-label="篩選工具"><button class="btn" id="allOn">全部啟用</button><button class="btn" id="allOff">全部停用</button><button class="btn" id="onlyPin">只留釘選</button></div>
<div class="list" id="list"></div><div class="empty" id="empty">沒有符合的工具。</div></section>

<section class="panel"><h2>資料管理</h2><div class="bar" style="margin:0"><button class="btn" id="exp">匯出設定</button><button class="btn" id="imp">匯入設定</button><button class="btn danger" id="rst">重設全部</button><input id="file" type="file" accept="application/json,.json" hidden></div></section>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="../assets/nova-tools.js"></script>
<script>
const C=novaConsole,S=C.get(),L=NOVA_TOOLS,$=id=>document.getElementById(id);
let tt;const toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2000)};
const sw=(s,k,label)=>`<div class="row"><label for="${s}-${k}">${label}</label><span class="sw"><input id="${s}-${k}" type="checkbox" data-s="${s}" data-k="${k}"${C[{on:'enabled',sfx:'toolSfx',fx:'toolFx'}[k]](s)?' checked':''}><i></i></span></div>`;
const when=t=>t?new Date(t).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'從未使用';
function render(){$('list').innerHTML=L.map(t=>{const s=t[0];return `<article class="tc${C.enabled(s)?'':' off'}" data-card="${s}" style="--accent:${t[4]}"><div class="th"><div class="ic">${t[1]}</div><div><h3>${t[2]}</h3><small data-info="${s}"></small></div><button class="pin" data-pin="${s}" aria-pressed="${C.pinned(s)}" aria-label="釘選 ${t[2]}">★</button></div>${sw(s,'on','啟用')}${sw(s,'sfx','音效')}${sw(s,'fx','動態效果')}<div class="ta"><a class="btn" href="../tools/${s}/index.html">開啟</a><button class="btn" data-reset="${s}">重置統計</button></div></article>`}).join('');info();filter()}
function info(){let n=0,e=0,best=null;L.forEach(t=>{const s=t[0],o=C.opens(s);n+=o;if(C.enabled(s))e++;if(o&&(!best||o>C.opens(best[0])))best=t;const el=document.querySelector(`[data-info="${s}"]`);if(el)el.textContent=`開啟 ${o} 次・${when(C.last(s))}`});
 $('stT').textContent=L.length;$('stE').textContent=e;$('stN').textContent=n;$('stTop').textContent=best?best[2]:'—'}
function filter(){const q=$('q').value.trim().toLowerCase();let c=0;document.querySelectorAll('.tc').forEach(el=>{const t=L.find(x=>x[0]===el.dataset.card),m=!q||(t[2]+t[3]+t[0]).toLowerCase().includes(q);el.classList.toggle('hide',!m);if(m)c++});$('empty').style.display=c?'none':'block'}
$('list').addEventListener('change',e=>{const i=e.target.closest('[data-s]');if(!i)return;C.setTool(i.dataset.s,i.dataset.k,i.checked);if(i.dataset.k==='on')i.closest('.tc').classList.toggle('off',!i.checked);info()});
$('list').addEventListener('click',e=>{const p=e.target.closest('[data-pin]'),r=e.target.closest('[data-reset]');
 if(p){const v=p.getAttribute('aria-pressed')!=='true';C.setTool(p.dataset.pin,'pin',v);p.setAttribute('aria-pressed',v)}
 if(r){C.resetStats(r.dataset.reset);info();toast('已重置統計')}});
$('q').oninput=filter;
const bulk=f=>{L.forEach(t=>C.setTool(t[0],'on',f(t[0])));render()};
$('allOn').onclick=()=>{bulk(()=>true);toast('已全部啟用')};$('allOff').onclick=()=>{bulk(()=>false);toast('已全部停用')};$('onlyPin').onclick=()=>{bulk(s=>C.pinned(s));toast('只保留釘選的工具')};
/* 全域設定 */
const hello=()=>{$('hello').innerHTML=(S.name?S.name.replace(/[<>&"]/g,'')+' 的':'我的')+'<span class="g">主控台</span>'};
$('uName').value=S.name;$('sSort').value=S.sort;$('sSfx').checked=S.sfx.on;$('sVol').value=S.sfx.vol;$('sFx').checked=S.fx;hello();
const sync=()=>dispatchEvent(new Event('nova-sfx-sync'));
$('uName').oninput=e=>{S.name=e.target.value.slice(0,24);C.save();hello()};
$('sSort').onchange=e=>{S.sort=e.target.value;C.save()};
$('sSfx').onchange=e=>{S.sfx.on=e.target.checked;C.save();sync()};
$('sVol').oninput=e=>{S.sfx.vol=+e.target.value;C.save();window.novaSfx&&novaSfx.play('click')};
$('sFx').onchange=e=>{S.fx=e.target.checked;C.save();toast('動態效果設定將於重新載入頁面後生效')};
/* 資料管理 */
$('exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([C.exportJSON()],{type:'application/json'}));a.download='zahtool-console.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已匯出設定')};
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{C.importJSON(r.result);toast('匯入成功，重新載入中…');setTimeout(()=>location.reload(),700)}catch(x){toast('匯入失敗：檔案格式不正確')}};r.readAsText(f);e.target.value=''};
$('rst').onclick=()=>{if(confirm('確定要重設所有主控台設定與使用統計嗎？')){C.reset();location.reload()}};
render();
</script>
<script src="../assets/nova-fx.js"></script><script src="../assets/nova-config.js"></script><script src="../assets/nova-account.js"></script><script src="../assets/nova-sfx.js"></script>
<script>if(window.novaAccount)novaAccount.on((u,s)=>{const i=document.getElementById('acInfo'),b=document.getElementById('acBtn');if(!novaAccount.enabled){i.textContent='尚未啟用雲端帳號，設定目前只存在這個瀏覽器。';b.textContent='了解更多'}else if(u){i.textContent='已登入：'+u.email+'・'+({idle:'',syncing:'同步中…',ok:'設定已同步',error:'同步失敗'}[s.status]||'');b.textContent='帳號管理'}else{i.textContent='登入後可在不同裝置同步這份主控台設定。';b.textContent='登入 / 註冊'}})</script>
</body></html>
