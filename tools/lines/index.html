/* Independent tool page layout */
.hero,#tools,#guides,#about,#faq,#privacy,footer .flinks,.navlinks{display:none!important}
#workspace{padding-top:42px;min-height:calc(100vh - 170px)}
#workspace>.wrap>.head{margin-bottom:24px;text-align:left;max-width:none}
#workspace>.wrap>.head .kicker{letter-spacing:2.5px}
#workspace>.wrap>.head h2{font-size:clamp(2rem,4vw,3.2rem)}
#workspace>.wrap>.head p{margin-left:0;max-width:700px}
#tabs .tab{display:none!important}

.panel{display:none!important}
#panel-lines{display:block!important;animation:toolReveal .55s cubic-bezier(.2,.75,.2,1) both}

.navright .pill-btn{font-size:.88rem}
@media(max-width:640px){#workspace{padding-top:24px}.navin{height:64px}}

/* ZAHTOOL Premium Motion Layer — per-tool cinematic animation */
:root{--motion-accent:var(--purple,#a18aff)}
#novaMotionCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.52;mix-blend-mode:screen}
body>.nav,body>main,body>.footer,body>#toast,body>.toast{position:relative;z-index:1}
.nav{backdrop-filter:blur(22px)!important;background:rgba(8,10,20,.72)!important}
.brand .logo{position:relative;isolation:isolate;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.brand:hover .logo{transform:rotate(-8deg) translateY(-2px);box-shadow:0 0 34px #a18aff66,0 0 60px #67d4ff22}
.hero .mock{transform-style:preserve-3d;animation:premiumFloat 7s ease-in-out infinite;box-shadow:0 28px 100px #0006,0 0 70px #a18aff12}
@keyframes premiumFloat{0%,100%{transform:translateY(0) rotateX(0) rotateY(0)}50%{transform:translateY(-10px) rotateX(1deg) rotateY(-1deg)}}
.workspace{position:relative;isolation:isolate;overflow:hidden;transform-style:preserve-3d}
.workspace:before{content:"";position:absolute;inset:-1px;pointer-events:none;z-index:0;border-radius:inherit;background:radial-gradient(ellipse at 95% 0%,color-mix(in srgb,var(--motion-accent) 13%,transparent),transparent 38%);opacity:.85}
.workspace>*{position:relative;z-index:1}
.nova-tool-stage{--accent:var(--motion-accent);height:118px;margin:0 0 22px;border-radius:20px;border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);background:linear-gradient(110deg,#ffffff04,#ffffff01 48%,color-mix(in srgb,var(--accent) 7%,transparent));position:relative;overflow:hidden;display:flex;align-items:center;padding:18px 24px;isolation:isolate;perspective:900px}
.nova-tool-stage:before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 15%,color-mix(in srgb,var(--accent) 9%,transparent) 50%,transparent 80%);transform:translateX(-100%);animation:stageSweep 7s ease-in-out infinite}
.nova-stage-copy{position:relative;z-index:2;display:flex;flex-direction:column;gap:5px}
.nova-stage-kicker{font:800 .68rem/1.3 Inter,system-ui,sans-serif;letter-spacing:.22em;color:var(--accent);opacity:.9}
.nova-stage-title{font-size:1.02rem;font-weight:800;letter-spacing:.015em;color:#f2f3ff}
.nova-stage-sub{font-size:.78rem;color:var(--muted,#a5abc8)}
.nova-orbit-scene{position:absolute;right:30px;top:50%;width:110px;height:110px;transform:translateY(-50%);transform-style:preserve-3d;display:grid;place-items:center;pointer-events:none}
.nova-orbit-core{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;font-size:1.05rem;font-weight:900;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 75%,white),color-mix(in srgb,var(--accent) 25%,#12152a));border:1px solid color-mix(in srgb,var(--accent) 75%,white);box-shadow:0 0 24px color-mix(in srgb,var(--accent) 38%,transparent),inset 0 1px 10px #ffffff66;transform:rotateX(18deg) rotateY(-24deg);animation:coreHover 4.8s ease-in-out infinite;z-index:2}
.nova-orbit-ring{position:absolute;width:82px;height:82px;border:1px solid color-mix(in srgb,var(--accent) 70%,transparent);border-radius:50%;transform:rotateX(68deg) rotateZ(0deg);box-shadow:0 0 18px color-mix(in srgb,var(--accent) 14%,transparent);animation:ringOrbit 8s linear infinite}
.nova-orbit-ring.r2{width:100px;height:54px;transform:rotateX(22deg) rotateY(58deg);border-color:color-mix(in srgb,var(--accent) 42%,transparent);animation-duration:11s;animation-direction:reverse}
.nova-orbit-ring.r3{width:62px;height:100px;transform:rotateY(66deg) rotateZ(25deg);border-style:dashed;opacity:.55;animation-duration:14s}
.nova-orbit-dot{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);top:14px;right:21px;animation:dotDrift 3s ease-in-out infinite}
@keyframes ringOrbit{to{rotate:360deg}}
@keyframes coreHover{0%,100%{transform:translateY(0) rotateX(18deg) rotateY(-24deg)}50%{transform:translateY(-7px) rotateX(26deg) rotateY(24deg)}}
@keyframes dotDrift{0%,100%{translate:0 0;opacity:.55}50%{translate:-16px 12px;opacity:1}}
@keyframes stageSweep{0%,58%,100%{transform:translateX(-100%)}75%{transform:translateX(100%)}}
.workspace-head{transition:transform .4s ease}
.workspace:hover .workspace-head{transform:translateY(-1px)}
.workspace .panel.active{animation:premiumPanelIn .65s cubic-bezier(.2,.8,.2,1) both}
@keyframes premiumPanelIn{from{opacity:0;transform:translateY(12px) scale(.995);filter:blur(4px)}to{opacity:1;transform:none;filter:blur(0)}}
.workspace .field,.workspace .stat,.workspace .result,.workspace .output,.workspace .dropzone{transition:border-color .3s,box-shadow .3s,transform .3s}
.workspace .field:focus-within{border-color:color-mix(in srgb,var(--motion-accent) 65%,white)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--motion-accent) 14%,transparent),0 10px 32px #0002}
.workspace button{transition:transform .22s cubic-bezier(.2,.8,.2,1),filter .22s,box-shadow .22s}
.workspace button:hover{transform:translateY(-2px);filter:brightness(1.08)}
.workspace button:active{transform:translateY(0) scale(.98)}
.reveal{transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1),filter .8s}
.tool-card{transform-style:preserve-3d;transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .35s,box-shadow .35s!important}
.tool-card:hover{transform:translateY(-7px) rotateX(2deg)!important;box-shadow:0 24px 55px #0004,0 0 28px #a18aff12}
@media(max-width:640px){.nova-tool-stage{height:102px;padding:14px 16px}.nova-orbit-scene{right:6px;transform:translateY(-50%) scale(.78);opacity:.75}.nova-stage-copy{max-width:65%}.nova-stage-title{font-size:.92rem}.nova-stage-sub{font-size:.7rem}#novaMotionCanvas{opacity:.3}}
@media(prefers-reduced-motion:reduce){#novaMotionCanvas{display:none}.nova-tool-stage:before,.nova-orbit-core,.nova-orbit-ring,.nova-orbit-dot,.hero .mock{animation:none!important}*,*:before,*:after{scroll-behavior:auto!important;transition-duration:.01ms!important}}
